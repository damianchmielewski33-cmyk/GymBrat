name: Dependency security

# Z57: skan zależności blokuje High/Critical (PR, push, cotygodniowy przebieg).
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # poniedziałek 06:17 UTC — nowe podatności w niezmienionych zależnościach
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm_audit:
    name: npm audit (High/Critical blokuje)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kod wyjścia != 0 przy High lub Critical (zależności produkcyjne i deweloperskie).
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  dependency_review:
    name: Przegląd nowych zależności w PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
