# Buduje APK GymBrat (WebView) przy każdym pushu na master/main —
# równolegle z deployem Vercel (strona). Vercel nie kompiluje Androida:
# `npm run build` tylko pobiera gotowy gymbrat.apk z GitHub Release.
# Ręcznie: Actions → „Build Android APK” → Run workflow.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Adres produkcyjnej strony GymBrat (https://…/ z ukośnikiem na końcu)"
        required: true
        type: string
        default: "https://gym-brat.vercel.app/"
  push:
    branches: [master, main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve API base URL
        id: api
        shell: bash
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ] || [ "$URL" = "https://" ]; then
            URL="${{ secrets.ANDROID_API_BASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL=$(grep -E '^API_BASE_URL=' android/gradle.properties | cut -d= -f2- || true)
          fi
          if [ -z "$URL" ] || [ "$URL" = "https://" ]; then
            echo "::error::Ustaw adres strony w Run workflow albo API_BASE_URL w android/gradle.properties"
            exit 1
          fi
          case "$URL" in
            */) ;;
            *) URL="${URL}/" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Używam API: $URL"

      - name: Write local.properties
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          echo "api.base.url=${{ steps.api.outputs.url }}" >> android/local.properties
          cat android/local.properties

      - name: Install image tools (branding icon)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webp
          python3 -m pip install --user pillow

      - name: Apply Android launcher icon from branding API
        shell: bash
        run: |
          chmod +x scripts/apply-android-branding-icon.sh
          scripts/apply-android-branding-icon.sh "${{ steps.api.outputs.url }}"
          echo "=== drawable after branding ==="
          ls -la android/app/src/main/res/drawable/ic_launcher_foreground* || true

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --stacktrace 2>&1 | tee ../build.log; then
            echo "=== Gradle failure (last 120 lines) ==="
            tail -n 120 ../build.log || true
            exit 1
          fi

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify APK exists
        working-directory: android
        run: |
          set -euo pipefail
          OUT_DIR="app/build/outputs/apk/release"
          APK="$OUT_DIR/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Brak $APK"; ls -la "$OUT_DIR" || true; exit 1
          fi
          ls -lh "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -1d "$SDK"/build-tools/* | sort -V | tail -n1)
          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" || true
          fi

      - name: Prepare APK artifact + version.json
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/gymbrat.apk
          cp dist/gymbrat.apk public/gymbrat.apk
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=' android/app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          export VERSION_CODE VERSION_NAME
          export GIT_SHA="${{ github.sha }}"
          python3 scripts/write-android-version.py
          ls -lh dist/gymbrat.apk public/gymbrat.apk public/android-version.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymbrat-apk
          path: |
            dist/gymbrat.apk
            dist/android-version.json

      - name: Publish GitHub Release android-latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest)
          files: |
            dist/gymbrat.apk
            dist/android-version.json
          body: |
            GymBrat Android WebView APK.
            Pobierz `gymbrat.apk` i zainstaluj na telefonie.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Odświeża public/gymbrat.apk na Vercel (fetch-android-apk.mjs przy buildzie).
      - name: Trigger Vercel deploy (refresh APK on site)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "Brak secret VERCEL_DEPLOY_HOOK_URL — pomijam (APK jest na GitHub Release)."
            exit 0
          fi
          echo "Wywołuję Vercel Deploy Hook…"
          HTTP_CODE="$(curl -sS -o /tmp/vercel-hook-body.txt -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL" || true)"
          echo "HTTP $HTTP_CODE"
          head -c 400 /tmp/vercel-hook-body.txt || true
          echo
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::warning::Deploy Hook nie zwrócił 200/201 — APK na Release jest świeży, ale strona może jeszcze serwować stary plik."
          fi
