# Jednorazowo: generuje stały release keystore GymBrat.
# Potem ustaw sekrety (patrz android/README.md) i buduj APK jak zwykle.
# Nie commituj keystore do repo — tylko artifact + sekrety GitHub.

name: Bootstrap Android signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate release keystore
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)"
          KEY_PASS="$STORE_PASS"
          ALIAS="gymbrat"
          OUT_DIR="$RUNNER_TEMP/gymbrat-signing"
          mkdir -p "$OUT_DIR"
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$OUT_DIR/gymbrat-release.jks" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=GymBrat, OU=Mobile, O=GymBrat, L=Warsaw, ST=Mazowieckie, C=PL"
          base64 -w0 "$OUT_DIR/gymbrat-release.jks" > "$OUT_DIR/keystore-base64.txt"
          {
            echo "# Ustaw w repo: Settings → Secrets and variables → Actions"
            echo "# albo: node scripts/set-android-signing-secrets.mjs <ten-katalog>"
            echo
            echo "ANDROID_RELEASE_KEY_ALIAS=$ALIAS"
            echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASS"
            echo "# ANDROID_RELEASE_KEYSTORE_BASE64 = zawartość keystore-base64.txt (jedna linia)"
          } > "$OUT_DIR/github-secrets.txt"
          {
            echo "storeFile=gymbrat-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
            echo "storeType=PKCS12"
          } > "$OUT_DIR/keystore.properties"
          echo "Wygenerowano keystore (PKCS12), alias=$ALIAS"

      - name: Upload signing bundle (pobierz raz, ustaw sekrety, usuń artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gymbrat-android-release-keystore
          path: ${{ runner.temp }}/gymbrat-signing/
          retention-days: 3
