# Przypomnienia GymBrat (push + dzienny skrót e-mail).
# Vercel Hobby pozwala tylko na crony dzienne, więc co ~5 min wołamy endpoint z GitHub Actions.
# Wymagane sekrety repozytorium:
#   REMINDERS_APP_URL  - adres produkcyjny, np. https://gym-brat.vercel.app (bez ukośnika na końcu)
#   CRON_SECRET        - ta sama wartość co CRON_SECRET w środowisku aplikacji
# Bez sekretów workflow kończy się bez błędu (nic nie wysyła).

name: Reminders cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: reminders-cron
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/reminders
        env:
          APP_URL: ${{ secrets.REMINDERS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Brak REMINDERS_APP_URL lub CRON_SECRET - pomijam."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 50 \
            -X POST "${APP_URL%/}/api/cron/reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
          echo
