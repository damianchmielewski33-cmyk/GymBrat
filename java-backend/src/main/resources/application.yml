server:
  port: ${PORT:8080}

gymbrat:
  source-repo: ${GYMBRAT_SOURCE_REPO:damianchmielewski33-cmyk/GymBrat}
  app-version: ${GYMBRAT_APP_VERSION:0.2.0}
  git-sha: ${GYMBRAT_GIT_SHA:}
  # Współdzielony sekret BFF: Next.js ustawia X-GymBrat-Proxy-Token przy proxy.
  proxy-token: ${GYMBRAT_PROXY_TOKEN:}
  cors-origins: ${GYMBRAT_CORS_ORIGINS:http://localhost:3000,https://gym-brat.vercel.app}
  android:
    # Produkcja: same-origin na Vercel (Chrome Android nie wisi jak przy GitHubie).
    apk-url: ${ANDROID_APK_URL:https://gym-brat.vercel.app/gymbrat.apk}
    version-json: classpath:android-version.json
    # Opcjonalne nadpisania (0 / puste = z pliku JSON)
    version-code: ${ANDROID_VERSION_CODE:0}
    version-name: ${ANDROID_VERSION_NAME:}
    notes: ${ANDROID_NOTES:}
