<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makieta 007 - Ekran Profil (przegląd, podstrony, stany), statyczna, tylko do odwzorowania</title>
<!-- Makieta referencyjna dla `frontend`. Specyfikacja: docs/ux/007-redesign-profil.md (wygrywa specyfikacja, gdy się różnią).
     Tokeny: wyłącznie istniejące z app/globals.css (--gym-black, --gym-gold, --gym-gold-deep, --gym-surface,
     --gym-surface-gold, --gym-border-gold, --gym-text-secondary, --gym-success, --destructive, --neon-fg, --gym-track).
     Ramki: 390 px (szerokość telefonu, jedna kolumna). Dane przykładowe (Marta Zielińska, 58 kg, suma 2812 kcal).
     Teksty prawne (LR-4, LR-6, LR-7, LR-9, LR-10) są PROJEKTEM i wymagają zatwierdzenia przez prawnika-człowieka. -->
<style>
  :root {
    --gym-black:#070708; --gym-gold:#ebc44a; --gym-gold-bright:#f7e28f; --gym-gold-deep:#c49a1f;
    --neon-fg:#120f05; --destructive:#ff3347; --foreground:rgba(255,255,255,.92);
    --gym-success:#3ecf72; --gym-text-secondary:#9a9182; --gym-border-gold:#33291a;
    --gym-track:#2b2518; --gym-surface:#161616; --gym-surface-gold:#15120b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#1d1d1d; color:var(--foreground); font:14px/1.35 "Segoe UI", system-ui, sans-serif; }
  .wall { display:flex; flex-wrap:wrap; gap:28px; padding:24px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { font-size:12px; color:#bbb; margin:0 0 8px; max-width:390px; }
  .phone { width:390px; height:844px; background:var(--gym-black); border-radius:14px; overflow:hidden; outline:1px solid #333; display:flex; flex-direction:column; }
  .scroll { flex:1; overflow-y:auto; padding:0 16px 96px; }
  .states { width:390px; background:var(--gym-black); border-radius:14px; outline:1px solid #333; padding:16px; display:flex; flex-direction:column; gap:20px; }
  .tn { font-variant-numeric:tabular-nums; }

  /* wiersz konta (layout) */
  .acct { display:flex; align-items:center; gap:12px; padding:12px 0 8px; }
  .av { width:40px; height:40px; flex:none; border-radius:999px; border:1px solid var(--gym-border-gold); background:var(--gym-surface-gold); display:grid; place-items:center; color:var(--gym-gold); font-weight:600; font-size:14px; }
  .acct .nm { font-size:15px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acct .em { font-size:12px; color:var(--gym-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acct > div { min-width:0; flex:1; }
  .btn-out { height:44px; padding:0 12px; border-radius:16px; border:1px solid var(--gym-border-gold); background:transparent; color:#fff; font-size:13px; font-weight:600; flex:none; display:inline-flex; align-items:center; gap:6px; }

  /* zakładki (ProfileTabs) */
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .ptab { flex:none; min-height:44px; display:inline-flex; align-items:center; padding:0 14px; border-radius:999px; border:1px solid var(--gym-border-gold); color:rgba(255,255,255,.8); font-size:13px; font-weight:500; text-decoration:none; white-space:nowrap; position:relative; }
  .ptab.on { border-color:rgba(235,196,74,.6); color:#fff; background:rgba(235,196,74,.08); font-weight:600; }
  .ptab .dot { position:absolute; top:8px; right:8px; width:6px; height:6px; border-radius:999px; background:var(--gym-gold); }

  /* nagłówek ekranu (AppPageHeader) */
  .hdr { padding:8px 0 4px; }
  .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-gold); }
  .h1 { font-size:28px; line-height:32px; font-weight:600; color:#fff; margin:4px 0 0; font-family:"Space Grotesk", system-ui, sans-serif; }
  .meta { font-size:12px; line-height:16px; color:var(--gym-text-secondary); }

  /* sekcje i karty */
  .sec { display:flex; align-items:center; gap:8px; margin:24px 0 10px; }
  .sec .idx { font-size:11px; color:var(--gym-gold); font-weight:600; }
  .sec h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#fff; margin:0; }
  .card { background:var(--gym-surface); border:1px solid var(--gym-border-gold); border-radius:22px; padding:16px; }
  .block { border-top:1px solid rgba(255,255,255,.1); margin-top:16px; padding-top:16px; }
  h3 { font-size:15px; font-weight:600; color:#fff; margin:0 0 8px; }

  /* pola (ProfileField: edytowalne) */
  .f { margin-top:12px; }
  .f:first-child { margin-top:0; }
  .f label { display:block; font-size:13px; font-weight:500; color:rgba(255,255,255,.85); margin-bottom:6px; }
  .inp { width:100%; height:48px; border-radius:16px; border:1px solid rgba(235,196,74,.35); background:rgba(0,0,0,.5); color:#fff; padding:0 14px; font-size:16px; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:space-between; }
  .inp .ph { color:var(--gym-text-secondary); }
  .inp .unit { color:var(--gym-text-secondary); font-size:13px; }
  .inp.err { border-color:var(--destructive); }
  .hint { font-size:12px; color:var(--gym-text-secondary); margin-top:6px; }
  .hint.err { color:#ff8593; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .row3 .inp { padding:0 10px; font-size:15px; }

  /* wyliczone (ProfileComputedValue) */
  .calc { background:var(--gym-surface-gold); border-radius:16px; padding:10px 12px; margin-top:12px; }
  .calc .lb { display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-text-secondary); }
  .calc .v { font-size:20px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; margin-top:2px; }
  .calc .v small { font-size:13px; color:var(--gym-text-secondary); font-weight:400; }
  .calc .w { font-size:12px; color:var(--gym-text-secondary); margin-top:4px; }
  .calc.compact { margin-top:0; padding:6px 10px; display:flex; align-items:center; gap:8px; }
  .calc.compact .v { font-size:15px; margin-top:0; }

  /* stan systemowy (ProfileSystemState) */
  .sys { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:999px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:var(--gym-text-secondary); font-size:12px; font-weight:600; white-space:nowrap; }
  .sys.active { color:var(--gym-gold); border-color:rgba(235,196,74,.35); background:rgba(235,196,74,.08); }
  .sys.warn { color:var(--gym-gold); border-color:rgba(235,196,74,.45); background:transparent; }
  .sys.dash { border-style:dashed; }
  .sys.ok { color:#fff; }

  /* chipy (ProfileChipGroup: chips) */
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chp { min-height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--gym-border-gold); background:transparent; color:rgba(255,255,255,.8); font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; }
  .chp[aria-pressed="true"] { border-color:rgba(235,196,74,.6); color:#fff; background:rgba(235,196,74,.10); font-weight:600; }
  /* chipy (ProfileChipGroup: list = radiogroup) */
  .lst { display:flex; flex-direction:column; gap:8px; }
  .opt { min-height:56px; border-radius:16px; border:1px solid var(--gym-border-gold); padding:10px 14px; display:flex; gap:12px; align-items:center; }
  .opt .rd { width:20px; height:20px; border-radius:999px; border:2px solid rgba(255,255,255,.4); flex:none; }
  .opt.on { border-color:rgba(235,196,74,.6); background:rgba(235,196,74,.06); }
  .opt.on .rd { border-color:var(--gym-gold); background:radial-gradient(circle, var(--gym-gold) 45%, transparent 50%); }
  .opt b { display:block; font-size:14px; color:#fff; font-weight:600; }
  .opt span { font-size:12px; color:var(--gym-text-secondary); }

  /* przełącznik (ProfileSwitch) */
  .swrow { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .swrow:last-child { border-bottom:none; }
  .swrow b { display:block; font-size:14px; color:#fff; font-weight:600; }
  .swrow span { display:block; font-size:12px; color:var(--gym-text-secondary); margin-top:2px; }
  .sw { width:48px; height:28px; border-radius:999px; background:rgba(255,255,255,.12); position:relative; flex:none; margin-top:2px; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:999px; background:#fff; }
  .sw.on { background:var(--gym-gold); }
  .sw.on::after { left:23px; background:var(--neon-fg); }

  /* kalendarz dni */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .day { height:64px; border-radius:14px; border:1px solid var(--gym-border-gold); background:transparent; color:rgba(255,255,255,.8); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:6px 0; font-size:11px; }
  .day .wd { font-weight:600; letter-spacing:.06em; color:var(--gym-text-secondary); }
  .day .dn { font-size:15px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  .day .ic { font-size:14px; line-height:1; }
  .day[aria-pressed="true"] { border-color:rgba(235,196,74,.6); background:rgba(235,196,74,.10); }
  .day[aria-pressed="true"] .ic { color:var(--gym-gold); }
  .day[aria-pressed="false"] .ic { color:var(--gym-text-secondary); }
  .legend { font-size:12px; color:var(--gym-text-secondary); margin-top:8px; }

  /* posiłki */
  .meal { background:rgba(0,0,0,.25); border:1px solid var(--gym-border-gold); border-radius:16px; padding:12px; margin-top:8px; }
  .meal .mh { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .meal .mh b { font-size:15px; color:#fff; font-weight:600; }
  .sumbox { margin-top:12px; }
  .sumrow { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .sumrow div { font-size:12px; color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; }
  .sumrow strong { display:block; font-size:15px; color:#fff; font-weight:600; }

  /* banery (InlineBanner) */
  .ban { display:flex; gap:10px; align-items:flex-start; border:1px solid rgba(235,196,74,.35); background:rgba(235,196,74,.08); border-radius:16px; padding:12px; font-size:13px; color:#fff; margin-top:12px; }
  .ban.info { border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.04); }
  .ban.err { border-color:var(--destructive); background:rgba(255,51,71,.08); }
  .ban .ico { flex:none; width:18px; text-align:center; }
  .ban small { display:block; font-size:12px; color:var(--gym-text-secondary); margin-top:4px; }

  /* zapis (ProfileSaveBlock) */
  .save { margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.1); }
  .st { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; min-height:24px; }
  .st.dirty { color:var(--gym-gold); }
  .st.ok { color:var(--gym-text-secondary); font-weight:500; }
  .st .dot { width:8px; height:8px; border-radius:999px; background:var(--gym-gold); }
  .cta { display:flex; align-items:center; justify-content:center; width:100%; height:48px; border-radius:16px; background:linear-gradient(to bottom,var(--gym-gold-bright),var(--gym-gold) 55%,var(--gym-gold-deep)); color:var(--neon-fg); font-weight:600; font-size:15px; border:0; margin-top:8px; }
  .cta[aria-disabled="true"] { background:rgba(255,255,255,.08); color:var(--gym-text-secondary); }
  .cta.busy { opacity:.75; }
  .hint.center { text-align:center; margin-top:8px; }
  .btn-o { height:48px; border-radius:16px; border:1px solid var(--gym-border-gold); background:transparent; color:#fff; font-weight:600; font-size:14px; width:100%; }
  .btn-g { height:44px; border-radius:16px; border:0; background:transparent; color:#fff; font-weight:500; font-size:14px; width:100%; }
  .btn-dz { height:48px; border-radius:16px; border:1px solid rgba(255,51,71,.6); background:transparent; color:#ff8593; font-weight:600; font-size:14px; width:100%; }
  .btn-dz[aria-disabled="true"] { border-color:rgba(255,51,71,.25); color:rgba(255,133,147,.55); }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .link { color:var(--gym-gold); font-size:13px; font-weight:600; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; }

  /* strefa niebezpieczna (ProfileDangerZone) */
  .danger { margin-top:32px; border:1px solid rgba(255,51,71,.45); background:rgba(255,51,71,.06); border-radius:22px; padding:16px; }
  .danger h2 { display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#ff8593; margin:0; }
  .danger p { font-size:13px; color:rgba(255,255,255,.85); margin:8px 0 0; }

  /* dialog (ConfirmDialog) */
  .dlg { background:#111; border:1px solid var(--gym-border-gold); border-radius:22px; padding:18px; }
  .dlg h3 { font-size:18px; }
  .dlg ul { margin:8px 0 0; padding-left:18px; font-size:13px; color:rgba(255,255,255,.85); }
  .dlg ul li { margin-top:2px; }

  .ico { font-size:14px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .sk { background:rgba(255,255,255,.06); border-radius:16px; height:72px; margin-top:12px; }
</style>
</head>
