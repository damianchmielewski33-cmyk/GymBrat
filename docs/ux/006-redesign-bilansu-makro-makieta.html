<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makieta 006 - Statystyki bilansu (MAKRO DZIŚ), statyczna, tylko do odwzorowania</title>
<!-- Makieta referencyjna dla `frontend`. Specyfikacja: docs/ux/006-redesign-bilansu-makro.md
     Tokeny: istniejące z app/globals.css (--gym-black, --gym-gold, --gym-gold-bright, --neon-fg,
     --destructive) oraz wartości z 004/005 (--gym-success, --gym-text-secondary, --gym-border-gold,
     --gym-track, --gym-surface-gold). Brak kolorów Tailwind i brak nowych tokenów.
     Ramki: 360x640 (Android WebView). Dane przykładowe, zgodne ze specyfikacją (sekcja 4 i 5). -->
<style>
  :root {
    --gym-black:#070708; --gym-gold:#ebc44a; --gym-gold-bright:#f7e28f; --gym-gold-deep:#c49a1f;
    --neon-fg:#120f05; --destructive:#ff3347; --foreground:rgba(255,255,255,.92);
    --gym-success:#3ecf72; --gym-text-secondary:#9a9182; --gym-border-gold:#33291a;
    --gym-track:#2b2518; --gym-surface:#161616; --gym-surface-gold:#15120b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#1d1d1d; color:var(--foreground); font:14px/1.35 "Segoe UI", system-ui, sans-serif; }
  .wall { display:flex; flex-wrap:wrap; gap:28px; padding:24px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { font-size:12px; color:#bbb; margin:0 0 8px; max-width:360px; }
  .phone { width:360px; height:640px; background:var(--gym-black); border-radius:12px; overflow:hidden; outline:1px solid #333; display:flex; flex-direction:column; }
  .scroll { flex:1; overflow-y:auto; padding:0 16px 24px; }
  .tab { font-variant-numeric:tabular-nums; }

  /* nagłówek ekranu (AppPageHeader) */
  .hdr { display:flex; gap:12px; align-items:flex-start; padding:12px 0 8px; }
  .iconbtn { width:44px; height:44px; flex:none; border-radius:999px; border:1px solid var(--gym-border-gold); background:var(--gym-surface-gold); display:grid; place-items:center; color:#fff; font-size:16px; }
  .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-gold); }
  .h1 { font-size:22px; line-height:26px; font-weight:600; color:#fff; margin:2px 0 0; font-family:"Space Grotesk", system-ui, sans-serif; }
  .meta { font-size:12px; line-height:16px; color:var(--gym-text-secondary); }

  /* sekcje i karty */
  .sec { display:flex; align-items:center; gap:8px; margin:24px 0 10px; }
  .sec .idx { font-size:11px; color:var(--gym-gold); font-weight:600; }
  .sec .t { font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#fff; }
  .sec .tr { margin-left:auto; font-size:12px; color:var(--gym-gold); min-height:44px; display:inline-flex; align-items:center; }
  .card { background:var(--gym-surface); border:1px solid var(--gym-border-gold); border-radius:22px; padding:16px; position:relative; overflow:hidden; }
  .card.hero::before { content:""; position:absolute; inset:0 0 auto 0; height:70px; background:linear-gradient(to bottom, rgba(235,196,74,.12), transparent); pointer-events:none; }
  .card > * { position:relative; }

  /* chip statusu dnia */
  .chip { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 8px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--gym-border-gold); color:var(--gym-text-secondary); white-space:nowrap; }
  .chip.gold { color:var(--gym-gold); border-color:rgba(235,196,74,.35); background:rgba(235,196,74,.10); }
  .chip.ok { color:var(--gym-success); border-color:rgba(62,207,114,.35); background:rgba(62,207,114,.12); }
  .chip.neu { color:rgba(255,255,255,.9); border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.08); }
  .chip.dash { border-style:dashed; }
  .chip svg { width:12px; height:12px; }

  /* pasek (Meter) */
  .meter { height:6px; border-radius:999px; background:rgba(255,255,255,.08); position:relative; overflow:hidden; }
  .meter.lg { height:8px; }
  .meter.sm { height:4px; }
  .meter .fill { position:absolute; left:0; top:0; bottom:0; background:var(--gym-gold); border-radius:999px; }
  .meter .today { position:absolute; top:0; bottom:0; background:rgba(235,196,74,.45); }
  .meter .over { position:absolute; top:0; bottom:0; right:0; background:rgba(255,255,255,.7); }
  .meter.dashed { background:none; border:1px dashed var(--gym-border-gold); }
  .meter .goalline { position:absolute; top:-2px; bottom:-2px; width:2px; background:#fff; right:0; }

  /* kafle makro w hero */
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .tile { background:rgba(0,0,0,.25); border:1px solid var(--gym-border-gold); border-radius:16px; padding:10px; }
  .lbl { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-text-secondary); }
  .val { font-size:18px; font-weight:600; color:#fff; margin-top:4px; }
  .sub { font-size:12px; color:var(--gym-text-secondary); }
  .st { font-size:12px; font-weight:600; margin-top:6px; }
  .st.gold { color:var(--gym-gold); }
  .st.neu { color:rgba(255,255,255,.9); }
  .st.muted { color:var(--gym-text-secondary); }

  /* tydzień */
  .wrow { margin-top:12px; }
  .wrow .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .wrow .name { font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#fff; }
  .wrow .nums { font-size:13px; color:#fff; }
  .wrow .pct { font-size:14px; font-weight:600; color:var(--gym-gold); }
  .wrow .dz { font-size:12px; color:var(--gym-text-secondary); margin-top:4px; }
  .trend { margin-top:14px; padding-top:14px; border-top:1px solid var(--gym-border-gold); }
  .bars { height:72px; position:relative; display:flex; align-items:flex-end; gap:6px; }
  .bars .ref { position:absolute; left:0; right:0; bottom:calc(72px * 100 / 150); border-top:1px dashed var(--gym-text-secondary); }
  .bar { flex:1; border-radius:6px 6px 2px 2px; background:rgba(235,196,74,.7); }
  .bar.today { background:rgba(235,196,74,.25); border:1px dashed var(--gym-gold); border-bottom:none; }
  .bar.none { background:none; height:2px !important; border-radius:0; border-top:1px solid var(--gym-text-secondary); }
  .axis { display:flex; gap:6px; margin-top:6px; }
  .axis span { flex:1; text-align:center; font-size:11px; color:var(--gym-text-secondary); }

  /* filtr */
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .fchip { flex:none; min-height:44px; display:inline-flex; align-items:center; gap:6px; padding:0 12px; border-radius:999px; border:1px solid var(--gym-border-gold); color:rgba(255,255,255,.8); font-size:13px; background:transparent; }
  .fchip.on { border-color:rgba(235,196,74,.6); color:#fff; background:rgba(235,196,74,.08); }
  .fchip b { font-weight:600; color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; }
  .fchip.on b { color:var(--gym-gold); }

  /* karta dnia */
  .day { margin-top:10px; background:var(--gym-surface); border:1px solid var(--gym-border-gold); border-radius:22px; padding:14px 16px; }
  .day .row { display:flex; align-items:flex-start; gap:8px; }
  .day .dn { font-size:15px; font-weight:600; color:#fff; }
  .day .dm { font-size:12px; color:var(--gym-text-secondary); margin-top:2px; }
  .day .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .day .cols .n { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gym-text-secondary); font-weight:600; }
  .day .cols .p { font-size:13px; font-weight:600; color:#fff; margin:3px 0 6px; font-variant-numeric:tabular-nums; }
  .day .cols .p.gold { color:var(--gym-gold); }
  .day .cols .p.neu { color:#fff; }
  .day .cols .p.muted { color:var(--gym-text-secondary); }
  .det { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.06); }
  .mrow { padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .mrow:last-child { border-bottom:none; }
  .mrow .h { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .mrow .nm { font-size:14px; font-weight:600; color:#fff; }
  .mrow .vv { font-size:12px; color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; }
  .mrow .stt { font-size:13px; font-weight:600; text-align:right; }
  .mrow .stt .pc { display:block; font-size:12px; color:var(--gym-text-secondary); font-weight:400; }
  .mrow .meter { margin-top:8px; }

  /* banery i puste stany */
  .banner { display:flex; gap:10px; align-items:flex-start; border:1px solid rgba(235,196,74,.35); background:rgba(235,196,74,.08); border-radius:16px; padding:10px 12px; font-size:13px; color:#fff; margin-top:12px; }
  .empty { border:1px dashed var(--gym-border-gold); border-radius:16px; padding:14px; text-align:center; font-size:13px; color:var(--gym-text-secondary); margin-top:10px; }
  .cta { display:inline-flex; align-items:center; justify-content:center; height:48px; border-radius:16px; padding:0 18px; background:linear-gradient(to bottom,var(--gym-gold-bright),var(--gym-gold) 55%,var(--gym-gold-deep)); color:var(--neon-fg); font-weight:600; font-size:15px; margin-top:12px; width:100%; border:0; }
  .link { color:var(--gym-gold); font-size:13px; font-weight:600; min-height:44px; display:inline-flex; align-items:center; }
  .note { font-size:12px; color:var(--gym-text-secondary); margin-top:6px; }
  .big { font-family:"Playfair Display", Georgia, serif; font-size:40px; line-height:44px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  .big small { font-family:"Segoe UI", system-ui, sans-serif; font-size:14px; color:var(--gym-text-secondary); font-weight:400; }
  .heroRow { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .heroRow .rt { text-align:right; font-size:14px; color:var(--gym-gold); font-weight:600; }
  .heroRow .rt.neu { color:#fff; }
</style>
</head>
<body>
<div class="wall">

  <!-- RAMKA 1: stan główny (dziś w toku, tydzień, odchylenia z filtrem) -->
  <figure>
    <figcaption>1. Stan główny, 360x640. Dziś w toku bez oceny, tydzień z odcinkiem „dziś w toku”, filtr z licznikami, karty zamkniętych dni (jedna rozwinięta). Kcal w pierwszym kadrze.</figcaption>
    <div class="phone"><div class="scroll">
      <header class="hdr">
        <button class="iconbtn" aria-label="Wróć do diety">&larr;</button>

      </header>

      <section aria-labelledby="s-dzis">

          <span class="chip gold tr" style="margin-left:auto;min-height:24px">Trening</span></div>
        <div class="card hero">
          <div class="meta">Niedziela, 25 paź · dzień w toku</div>

            <div class="fill" style="width:59%"></div>

            <div class="tile"><div class="lbl">Tłuszcz</div><div class="val tab">41 g</div><div class="sub">z 70 g</div>
              <div class="meter sm" style="margin-top:8px"><div class="fill" style="width:59%"></div></div>
              <div class="st gold">do celu 29 g</div></div>
          </div>
        </div>
      </section>

      <section aria-labelledby="s-tyd">
        <div class="sec"><span class="idx">02</span><h2 class="t" id="s-tyd" style="font-size:12px;margin:0">Tydzień PN→dziś</h2>
          <a class="link tr" href="#" style="margin-left:auto">Tydzień →</a></div>
        <div class="card">

          <div class="wrow">

            <div class="meter" style="margin-top:8px"><div class="fill" style="width:62%"></div><div class="today" style="left:62%;width:10%"></div></div>

          <div class="wrow">
            <div class="top"><span class="name">Węgle</span><span class="nums tab">890 / 1 300 g · <span class="pct">68%</span></span></div>

              <div class="bar none" title="Pn 19: brak wpisów"></div>

      <section aria-labelledby="s-odch">

          <button class="fchip" aria-pressed="false">Tłuszcz <b>1</b></button>

            <div class="mrow">

            <div class="mrow">
              <div class="h"><div><div class="nm">Białko</div><div class="vv">96 z 115 g</div></div>
                <div class="stt ok">&check; w normie<span class="pc">96%</span></div></div>
              <div class="meter" style="margin-top:8px"><div class="fill" style="width:96%"></div></div>
            </div>
            <div class="mrow">
              <div class="h"><div><div class="nm">Węgle</div><div class="vv">312 z 280 g · dzień treningowy</div></div>
                <div class="stt neu">&uarr; ponad cel +32 g<span class="pc">112%</span></div></div>
              <div class="meter" style="margin-top:8px"><div class="fill" style="width:100%"></div><div class="over" style="left:auto;width:12%"></div></div>
            </div>
            <div class="mrow">
              <div class="h"><div><div class="nm">Tłuszcz</div><div class="vv">72 z 75 g</div></div>
                <div class="stt ok">&check; w normie<span class="pc">96%</span></div></div>
              <div class="meter" style="margin-top:8px"><div class="fill" style="width:96%"></div></div>
            </div>
          </div>
        </article>

        <article class="day" aria-label="Piątek, 23 paź, w normie">

            <div><div class="dn">Piątek</div><div class="dm">23 paź · Odpoczynek</div></div>

  <!-- RAMKA 2: stany specjalne (dzień bez wpisów rozwinięty, brak celu, niepełne dane) -->
  <figure>
    <figcaption>2. Stany specjalne: pusty start dziś, cel nieustawiony, niepełne dane (produkt bez białka), dzień bez wpisów.</figcaption>
    <div class="phone"><div class="scroll">
      <header class="hdr">

        <div><div class="kicker">MAKRO DZIŚ</div><h1 class="h1">Statystyki bilansu</h1><div class="meta">19–25 paź 2026 · pn→dziś</div></div>
      </header>

      <section>
        <div class="sec"><span class="idx">01</span><h2 class="t" style="font-size:12px;margin:0">Dziś</h2>
          <span class="chip tr" style="margin-left:auto;min-height:24px">Odpoczynek</span></div>
        <div class="card hero">
          <div class="meta">Niedziela, 25 paź · dzień w toku</div>

      <section>
        <div class="sec"><span class="idx">02</span><h2 class="t" style="font-size:12px;margin:0">Cel nieustawiony</h2></div>
