<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makieta 011 - Historia treningów (statyczna, referencja dla frontend)</title>
<!-- Makieta referencyjna dla `frontend`. Specyfikacja: docs/ux/011-redesign-historii-treningow.md (wygrywa specyfikacja, gdy się różnią).
     Tokeny wyłącznie z app/globals.css: --gym-black, --gym-gold, --gym-gold-deep, --gym-surface, --gym-surface-raised,
     --gym-border-gold, --gym-text-secondary, --gym-success, --destructive, --neon-fg, --gym-on-gold.
     Ramki: 390 px (telefon), jedna ramka 360 px dla kontroli wąskiego ekranu. Brak JS logiki biznesowej.
     Dane przykładowe: fikcyjne treningi (plany Push A, Nogi, Pull, Barki i plecy, Klatka i ramiona), data "dziś" = 26.10.
     Ikony: lucide (w makiecie uproszczone symbole o tym samym znaczeniu). -->
<style>
  :root {
    --gym-black:#070708; --gym-gold:#ebc44a; --gym-gold-bright:#f7e28f; --gym-gold-deep:#c49a1f;
    --gym-on-gold:#1a1408; --neon-fg:#120f05; --destructive:#ff3347; --foreground:rgba(255,255,255,.92);
    --gym-success:#3ecf72; --gym-text-secondary:#9a9182; --gym-border-gold:#33291a;
    --gym-surface:#161616; --gym-surface-raised:#1c1c1f; --gym-surface-gold:#15120b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#1d1d1d; color:var(--foreground); font:14px/1.35 "Segoe UI", system-ui, sans-serif; }
  .wall { display:flex; flex-wrap:wrap; gap:28px; padding:24px; align-items:flex-start; }
  .group-title { width:100%; color:#ddd; font:600 15px/1.2 system-ui; margin:16px 0 0; padding-bottom:6px; border-bottom:1px solid #333; }
  figure { margin:0; }
  figcaption { font-size:12px; color:#bbb; margin:0 0 8px; max-width:390px; line-height:1.4; }
  .ph { width:390px; height:844px; background:var(--gym-black); border-radius:14px; overflow:hidden; outline:1px solid #333; display:flex; flex-direction:column; position:relative; }
  .ph.short { height:620px; }
  .ph.w360 { width:360px; }
  .sc { flex:1; overflow-y:auto; padding:0 16px 24px; position:relative; }
  .sc::-webkit-scrollbar { display:none; }
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .panelwrap { width:390px; background:var(--gym-black); border-radius:14px; outline:1px solid #333; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .lbl { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gym-text-secondary); font-weight:600; margin:0 0 6px; }

  /* ikony */
  .i { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .i.sm { width:16px; height:16px; }
  .i.xs { width:14px; height:14px; }

  /* topbar */
  .top { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 8px 0 16px; flex:none; }
  .brand { font:600 13px/1 "Space Grotesk", system-ui; letter-spacing:.14em; color:#fff; }
  .icon-btn { width:44px; height:44px; border-radius:16px; border:1px solid var(--gym-border-gold); background:transparent; color:#fff; display:inline-grid; place-items:center; flex:none; padding:0; }
  .icon-btn.ghost { border-color:transparent; }

  /* wróć + nagłówek */
  .back { display:inline-flex; align-items:center; gap:6px; min-height:44px; color:#fff; font-size:14px; text-decoration:none; padding:0 4px; }
  .hdr { padding:4px 0 0; }
  .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-gold); }
  .h1 { font-size:28px; line-height:32px; font-weight:600; color:#fff; margin:4px 0 0; font-family:"Space Grotesk", system-ui, sans-serif; }
  .meta { font-size:12px; line-height:16px; color:var(--gym-text-secondary); margin-top:4px; font-variant-numeric:tabular-nums; }

  /* sekcja (SectionLabel) */
  .sec { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:20px 0 10px; min-height:24px; }
  .sec h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#fff; margin:0; }
  .sec .chipz { font-size:12px; color:var(--gym-gold); border:1px solid rgba(235,196,74,.45); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .sec .chipz.neutral { color:var(--gym-text-secondary); border-color:rgba(255,255,255,.15); }

  /* karty */
  .card { background:var(--gym-surface); border:1px solid var(--gym-border-gold); border-radius:22px; padding:16px; }
  .card.flat { border-color:rgba(255,255,255,.08); }
  .panel { background:var(--gym-surface); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; }
  .muted { color:var(--gym-text-secondary); font-size:12px; line-height:16px; }
  .tn { font-variant-numeric:tabular-nums; }
  h3 { font-size:15px; font-weight:600; color:#fff; margin:0; line-height:20px; }

  /* podsumowanie */
  .sum { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:16px 12px; }
  .sum > div { text-align:center; min-width:0; }
  .sum .k { font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-text-secondary); }
  .sum .v { margin-top:6px; font:500 26px/1 "Space Grotesk", system-ui; color:#fff; font-variant-numeric:tabular-nums; }
  .sum .v small { font:400 13px/1 system-ui; color:var(--gym-text-secondary); margin-left:3px; }
  .sum .v.dash { color:var(--gym-text-secondary); }
  .sum .s { margin-top:6px; font-size:11px; line-height:14px; color:var(--gym-text-secondary); display:flex; align-items:center; justify-content:center; gap:4px; }
  .limit { font-size:12px; line-height:16px; color:var(--gym-text-secondary); margin:8px 2px 0; }

  /* filtr */
  .fbar { position:sticky; top:0; z-index:2; background:var(--gym-black); margin:14px -16px 0; padding:8px 16px 8px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent); mask-image:linear-gradient(90deg,#000 88%,transparent); }
  .fbar::-webkit-scrollbar { display:none; }
  .chp { flex:none; min-height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--gym-border-gold); background:transparent; color:rgba(255,255,255,.82); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit; }
  .chp .n { color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; font-size:12px; }
  .chp.on { border-color:rgba(235,196,74,.6); background:rgba(235,196,74,.10); color:#fff; font-weight:600; }
  .chp.on .n { color:var(--gym-gold); }
  .chp.on .i { color:var(--gym-gold); }
  .resbar { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; font-size:12px; color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; }
  .resbar b { color:#fff; font-weight:600; }
  .clear { background:transparent; border:0; color:var(--gym-gold); font:600 13px/1 system-ui; min-height:44px; padding:0 8px; display:inline-flex; align-items:center; gap:4px; }

  /* tydzień */
  .wk { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; margin:22px 0 10px; }
  .wk .tag { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--gym-gold); }
  .wk .tag.mute { color:var(--gym-text-secondary); }
  .wk h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#fff; margin:4px 0 0; }
  .wk .agg { font-size:12px; color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* wiersz treningu */
  .row { display:flex; gap:12px; align-items:center; padding:12px 14px; min-height:72px; width:100%; background:transparent; border:0; color:inherit; text-align:left; font:inherit; }
  .row + .row { border-top:1px solid rgba(255,255,255,.06); }
  .row .d { width:48px; flex:none; }
  .row .d .wd { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gym-text-secondary); font-weight:600; }
  .row .d .wd.today { color:var(--gym-gold); }
  .row .d .dt { font:500 15px/1.2 "Space Grotesk", system-ui; color:#fff; font-variant-numeric:tabular-nums; margin-top:2px; }
  .row .mid { flex:1; min-width:0; }
  .row .mid .m { font-size:12px; color:var(--gym-text-secondary); margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .end { text-align:right; flex:none; }
  .row .kg { font:500 16px/1 "Space Grotesk", system-ui; color:#fff; font-variant-numeric:tabular-nums; }
  .row .chev { color:var(--gym-text-secondary); margin-left:auto; display:block; margin-top:6px; }
  .row.open { background:rgba(255,255,255,.02); }
  .row.hl { box-shadow: inset 0 0 0 2px var(--gym-gold); }

  /* pastylka porównania */
  .cmp { display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:16px; color:var(--gym-text-secondary); margin-top:4px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cmp .i { width:14px; height:14px; }
  .cmp.up { color:#fff; }
  .cmp.up .i { color:var(--gym-success); }

  /* rozwinięcie */
  .det { border-top:1px solid rgba(255,255,255,.06); padding:12px 14px 16px; display:flex; flex-direction:column; gap:16px; background:rgba(255,255,255,.015); }
  .cblk { border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:12px 14px; background:var(--gym-surface); }
  .cblk .h { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gym-text-secondary); font-weight:600; }
  .cblk p { margin:6px 0 0; font-size:14px; line-height:20px; color:rgba(255,255,255,.85); }
  .cblk p b { color:#fff; font-weight:600; font-variant-numeric:tabular-nums; }
  .cblk .foot { margin-top:8px; font-size:12px; line-height:16px; color:var(--gym-text-secondary); }
  .legend { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gym-text-secondary); line-height:16px; }
  .legend .i { color:var(--gym-gold); width:14px; height:14px; }
  .legend b { color:#fff; font-weight:600; }
  .exl { display:flex; flex-direction:column; gap:12px; }
  .exn { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .exn .nm { font-size:14px; font-weight:500; color:rgba(255,255,255,.92); min-width:0; }
  .exn .tt { font-size:12px; color:var(--gym-text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sets { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .set { height:36px; min-width:72px; padding:0 10px; border-radius:12px; border:1px solid rgba(255,255,255,.14); display:inline-flex; align-items:center; justify-content:center; gap:4px; font:500 13px/1 "Space Grotesk", system-ui; color:rgba(255,255,255,.85); font-variant-numeric:tabular-nums; }
  .set .x { color:var(--gym-text-secondary); }
  .set.pr { border-color:var(--gym-gold); background:rgba(235,196,74,.10); color:var(--gym-gold); font-weight:600; }
  .set.pr .i { width:12px; height:12px; }
  .set.none { border-style:dashed; color:var(--gym-text-secondary); }
  .acts { display:flex; gap:8px; }
  .btn { height:48px; padding:0 14px; border-radius:16px; font:600 14px/1 system-ui; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; width:100%; text-decoration:none; color:#fff; background:transparent; flex:1; }
  .btn.out { border-color:var(--gym-border-gold); }
  .btn.dz { border-color:rgba(255,51,71,.45); color:#ff8593; }
  .btn.dz-fill { background:var(--destructive); color:#fff; border-color:var(--destructive); }
  .btn.cta { background:linear-gradient(180deg,var(--gym-gold-bright),var(--gym-gold) 55%,var(--gym-gold-deep)); color:var(--neon-fg); }
  .btn.ghost { background:transparent; color:var(--gym-gold); }
  .btn.full { flex:none; }
  .hint { font-size:12px; line-height:16px; color:var(--gym-text-secondary); margin-top:8px; }

  /* stany, banery, szkielety */
  .banner { border-radius:16px; padding:12px 14px; display:flex; gap:10px; font-size:13px; line-height:18px; border:1px solid; }
  .banner .i { margin-top:1px; }
  .banner b { display:block; font-weight:600; color:#fff; margin-bottom:2px; }
  .banner.info { border-color:rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:rgba(255,255,255,.85); }
  .banner.warn { border-color:rgba(235,196,74,.45); background:rgba(235,196,74,.06); color:rgba(255,255,255,.88); }
  .banner.err { border-color:rgba(255,51,71,.5); background:rgba(255,51,71,.07); color:#ffd0d5; }
  .sk { background:rgba(255,255,255,.06); border-radius:12px; }
  .glyph { width:56px; height:56px; border-radius:18px; background:var(--gym-surface-gold); border:1px solid var(--gym-border-gold); display:grid; place-items:center; color:var(--gym-gold); margin:0 auto; }
  .glyph .i { width:26px; height:26px; }
  .empty { text-align:center; padding:28px 18px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .empty h3 { margin-top:8px; }
  .empty p { margin:0; font-size:14px; line-height:20px; color:rgba(255,255,255,.8); }

  /* dialog */
  .dlg { position:absolute; left:20px; right:20px; top:50%; transform:translateY(-50%); background:#1c1c1f; border:1px solid var(--gym-border-gold); border-radius:22px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .dlg h3 { font-size:17px; margin-bottom:8px; }
  .dlg p { margin:0; font-size:14px; line-height:20px; color:rgba(255,255,255,.8); }
  .dlg .acts { display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .dlg .acts .btn { width:100%; }
  .dlg .banner { margin-top:12px; }

  /* belka dolna */
  .belka { position:absolute; left:12px; right:12px; bottom:10px; height:56px; border-radius:30px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-around; align-items:center; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.55); }
  .belka .on { color:var(--gym-gold); }

  /* panel wariantów */
  .var { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .var .sum { padding:12px 8px; }
  .var .sum .v { font-size:22px; }
  .tiny { font-size:11px; line-height:14px; color:var(--gym-text-secondary); }
  .spacer { height:12px; }
</style>
</head>

<div class="wall">

<!-- ============ GRUPA 1: LISTA ============ -->
<div class="group-title">1. Lista i podsumowanie (stan główny)</div>

<figure>
  <figcaption>A1. Stan główny: filtr „Wszystkie”, podsumowanie z zakresem „Wszystkie treningi”, tonaż z podpisem limitu „z 400 ostatnich”. Tygodnie bez numerów; „TEN TYDZIEŃ” jako etykieta. Zwinięte wiersze z pastylką porównania (strzałka + procent + data, ikona zawsze obecna). Numer sesji usunięty.</figcaption>
  <div class="ph">
    <div class="top"><span class="brand">GYMBRAT</span><div style="display:flex;gap:4px"><button class="icon-btn ghost" aria-label="Powiadomienia"><svg class="i"><use href="#i-bell"/></svg></button><button class="icon-btn" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button></div></div>
    <div class="sc">
      <a class="back" href="#"><svg class="i sm"><use href="#i-arrow-left"/></svg>Wróć</a>
      <div class="hdr">
        <div class="kicker">Trening</div>
        <h1 class="h1">Historia treningów</h1>
        <div class="meta">38 treningów w historii</div>
      </div>

      <div class="sec"><h2>Podsumowanie</h2><span class="chipz neutral">Wszystkie treningi</span></div>
      <div class="card sum" role="group" aria-label="Podsumowanie: wszystkie treningi">
        <div><div class="k">Na tydzień</div><div class="v tn">2,4</div><div class="s">średnio z 8 tyg.</div></div>
        <div><div class="k">Średni czas</div><div class="v tn">69<small>min</small></div><div class="s">z 38 treningów</div></div>
        <div><div class="k">Tonaż</div><div class="v tn">180,6<small>t</small></div><div class="s">z 400 ostatnich <svg class="i xs" aria-hidden="true"><use href="#i-info"/></svg></div></div>
      </div>
      <p class="limit">Tonaż liczymy z 400 ostatnich treningów. Starsze się nie wliczają.</p>

      <div class="fbar" role="group" aria-label="Filtr dnia planu">
        <button class="chp on" aria-pressed="true"><svg class="i xs"><use href="#i-check"/></svg>Wszystkie <span class="n">38</span></button>
        <button class="chp" aria-pressed="false">Push A <span class="n">12</span></button>
        <button class="chp" aria-pressed="false">Nogi <span class="n">9</span></button>
        <button class="chp" aria-pressed="false">Pull <span class="n">8</span></button>
        <button class="chp" aria-pressed="false">Barki i plecy <span class="n">5</span></button>
        <button class="chp" aria-pressed="false">Klatka i ramiona <span class="n">4</span></button>
      </div>
      <div class="resbar"><span>Pokazano <b>38</b> treningów</span></div>

      <div class="wk"><div><div class="tag">Ten tydzień</div><h2>26 paź – 1 lis</h2></div><span class="agg">1 tr. · 4,0 t</span></div>
      <div class="panel">
        <button class="row" aria-expanded="false" aria-label="Push A, 26.10, 4 020 kilogramów, +2,1% względem 22.10. Pokaż szczegóły">
          <div class="d"><div class="wd today">Dziś</div><div class="dt">26.10</div></div>
          <div class="mid"><h3>Push A</h3><div class="m">52 min · 17 serii · 6 ćw.</div></div>
          <div class="end"><div class="kg">4 020 kg</div><div class="cmp up"><svg class="i"><use href="#i-trend-up"/></svg>+2,1% · 22.10</div></div>
        </button>
      </div>
